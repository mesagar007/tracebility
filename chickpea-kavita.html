    /* brand: bg-with-white-text roles - fixed solid, does not flip with theme */

    --green-900:#153a24; --green-700:#1f8f4f; --green-100:#e7f6ec;
    --bg:#ffffff; --card:#ffffff; --border:#e2e6dc; --muted:#3f6b4d; --text:#215d38;

      --pest:#ff8f76; --pest-bg:#3a2019;
      --neutral-badge-bg:#272c22; --neutral-badge-text:#b9bfae;

    }

  header .eyebrow, header h1, header .season, .brand-logo { position:relative; z-index:1; }
  .brand-logo { display:block; width:26px; height:26px; border-radius:7px; margin:0; box-shadow: var(--shadow); flex:none; }
  header .eyebrow { font-size:0.64rem; text-transform:uppercase; letter-spacing:0.1em; color: var(--header-eyebrow); margin-bottom:0; font-weight:700; }
  .brand-row { display:flex; align-items:center; justify-content:center; gap:7px; margin-bottom:6px; }
  header h1 { margin:0 0 2px; font-family: var(--font-display); font-weight:800; font-size: 1.25rem; letter-spacing:-0.01em; color: var(--green-900); text-wrap: balance; }
  header .season { font-size:0.72rem; color: var(--header-season); font-variant-numeric: tabular-nums; flex:none; }
  .title-row { display:flex; flex-direction:column; gap:2px; max-width:520px; margin:0 auto; }
  .title-row h1 { margin:0; }
  #content { max-width: 720px; margin: 0 auto; padding: 10px 14px 36px; }
  .section { margin-bottom: 22px; }
  .card { background: var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; box-shadow: var(--shadow); }
  .detail-label { color: var(--muted); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:3px; }
  .detail-value { color: var(--text); font-variant-numeric: tabular-nums; }
  .map-box { margin-top:12px; border-radius:12px; overflow:hidden; border:1px solid var(--border); position:relative; isolation:isolate; }
  .map-box img { display:block; width:100%; height:auto; }
  .farm-leaflet { width:100%; height:150px; background: var(--green-100); }
  .map-link { margin-top:4px; text-align:right; }
  .map-link a { font-size:0.8rem; color: var(--green-700); text-decoration:none; font-weight:600; }
  .map-link a:hover { text-decoration:underline; }
  .map-placeholder { background: var(--green-100); color: var(--green-900); font-size:0.86rem; padding:20px;
                      text-align:center; border-radius:12px; border:1px dashed var(--border); }
  .event { border-left:3px solid var(--border); padding:8px 0 8px 14px; margin-bottom:4px; }
  .event.pest { border-left-color: var(--pest); }
  .event-head { font-size:0.89rem; font-weight:700; color: var(--text); }
  .event-head .date { font-variant-numeric: tabular-nums; color: var(--green-700); }
  .event-head .meta { font-weight:400; color: var(--muted); font-size:0.78rem; }
  .pest-badge { display:inline-flex; align-items:center; background: var(--pest-bg); color: var(--pest); font-size:0.68rem;
                font-weight:700; padding:7px 12px; border-radius:999px; margin:3px 0 0 0; vertical-align:middle;
                border:none; cursor:pointer; font-family:inherit; -webkit-tap-highlight-color:transparent;
                transition:background-color .15s ease, color .15s ease; }
  .pest-badge:active { background: var(--pest); color:#fff; }
  .pest-badge::after { content:' \2304'; font-size:0.9em; display:inline-block; transition:transform .15s ease; }
  .pest-badge.open::after { transform:rotate(180deg); }
  .pest-badge-why { font-size:0.78rem; color: var(--muted); padding-left:10px; margin:0;
                     border-left:2px solid var(--pest-bg); line-height:1.4;
                     max-height:0; opacity:0; overflow:hidden;
                     transition:max-height .22s ease, opacity .18s ease, margin-top .22s ease; }
  .pest-badge-why.show { max-height:100px; opacity:1; margin-top:5px; }
  .event-desc { font-size:0.9rem; margin:4px 0 0; }
  .event-note { font-size:0.81rem; color: var(--muted); margin:3px 0 0; padding-left:10px; border-left:2px solid var(--border); }
  .photos { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .photo-thumb { display:block; width:64px; height:64px; border-radius:8px; overflow:hidden; border:1px solid var(--border);
                 flex:none; padding:0; background:none; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .photo-thumb:active img { opacity:0.75; }
  .photo-thumb img { display:block; width:100%; height:100%; object-fit:cover; }
  .lightbox { position:fixed; inset:0; background:rgba(10,14,8,0.86); display:flex; align-items:center;
              justify-content:center; padding:32px 20px; z-index:1300; overflow-y:auto;
              opacity:0; visibility:hidden; pointer-events:none; transition:opacity .2s ease; }
  .lightbox.open { opacity:1; visibility:visible; pointer-events:auto; }
  .lightbox-media { position:relative; max-width:100%; max-height:100%; line-height:0; }
  .lightbox-media img { display:block; max-width:100%; max-height:80vh; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,0.4);
              transform:scale(0.97); transition:transform .2s ease; }
  .lightbox.open .lightbox-media img { transform:scale(1); }
  .lightbox-details { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:6px 16px; padding:26px 14px 12px; border-radius:0 0 10px 10px;
    background:linear-gradient(to top, rgba(10,14,8,0.82), rgba(10,14,8,0)); }
  .lightbox-detail-item { display:flex; align-items:center; gap:6px; color:#fff; font-size:0.76rem; font-weight:700;
    font-variant-numeric:tabular-nums; text-shadow:0 1px 3px rgba(0,0,0,0.5); line-height:1.3; }
  .lightbox-detail-icon { font-size:0.9rem; line-height:1; }
  .lightbox-close { position:absolute; top:14px; right:14px; background:rgba(255,255,255,0.12); color:#fff; border:none;
                     width:40px; height:40px; border-radius:50%; font-size:1.1rem; cursor:pointer; line-height:1; z-index:2;
                     -webkit-tap-highlight-color:transparent; }
  .lightbox-close:hover, .lightbox-close:active { background:rgba(255,255,255,0.26); }
  .inputs-list { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
  .input-chip { background: var(--green-100); color: var(--green-900); font-size:0.8rem; font-weight:600;
                padding:4px 12px; border-radius:999px; border:1px solid transparent; cursor:pointer; font-family: var(--font-body); }
  .input-chip:hover { border-color: var(--brand-solid-hover); }
  .input-chip.active { background: var(--brand-solid); color:#fff; }
  .input-chip.active .cnt { color: rgba(255,255,255,0.8); }
  .input-chip .cnt { font-variant-numeric: tabular-nums; color: var(--muted); font-weight:400; margin-left:3px; }
  .input-detail { font-size:0.85rem; color: var(--text); background: var(--green-100); border-radius:10px;
                  padding:12px 14px; margin-top:10px; line-height:1.5; }
  footer { text-align:center; font-size:0.77rem; color: var(--muted); padding: 14px 20px 34px; }

/* --- Leaflet (inlined) --- */
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;

  .badge-pill { background:var(--green-100); color:var(--green-900); border-radius:10px; border:1px solid rgba(31,143,79,0.22);
    box-shadow:0 1px 3px rgba(21,58,36,0.1); transition:box-shadow .15s ease, border-color .15s ease; }
  .badge-pill[open] { border-color:rgba(31,143,79,0.4); box-shadow:0 2px 8px rgba(21,58,36,0.16); }
  .badge-pill summary { font-size:0.72rem; font-weight:700; padding:10px; line-height:1.25; cursor:pointer;
    list-style:none; display:flex; align-items:center; gap:9px; -webkit-tap-highlight-color:transparent; border-radius:10px;
    transition:background-color .15s ease; }
  .badge-pill summary::-webkit-details-marker { display:none; }
  .badge-pill summary:active { background:rgba(31,143,79,0.1); }
  .badge-icon { flex:none; width:24px; height:24px; border-radius:7px; background:var(--brand-solid); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:0.8rem; box-shadow:0 1px 2px rgba(0,0,0,0.18); }
  .badge-text { flex:1; min-width:0; }
  .badge-pill summary::after { content:'\2304'; font-size:0.85rem; font-weight:700; color:var(--brand-solid); flex:none; transition:transform .15s ease; }
  .badge-pill[open] summary::after { transform:rotate(180deg); }
  .badge-pill p { margin:0; padding:0 12px 10px 43px; font-size:0.68rem; font-weight:500; color:var(--text); line-height:1.4; }
  .record-address { margin-top:2px; padding-top:10px; border-top:1px dashed var(--border); }
  .record-gps { font-size:0.72rem; color:var(--muted); margin-top:4px; font-variant-numeric:tabular-nums; }
</style>

ar biostimulant that supplies readily-absorbed amino acids, helping the plant grow steadily and recover from stress.","PDR":"Short for plant-defence regulator - a formulation typically paired with nutrient sprays to support the plant's own natural resilience.","Microalgal":"A microalgae-based biostimulant that supplies micronutrients and growth compounds supporting overall plant vigour.","Beauveria":"Beauveria bassiana, a naturally occurring fungus that infects and controls soft-bodied insect pests - a biological alternative to chemical pesticides.","Jeevamrit":"A traditional fermented microbial culture (cow dung, cow urine, jaggery and pulse flour) used to build up beneficial soil microbes and improve nutrient availability to the plant.","Trichoderma":"A beneficial soil fungus that colonises the root zone and outcompetes disease-causing soil pathogens - a biological approach to disease control.","Potassium humate":"A humic-acid-based soil conditioner that improves root development and helps the plant take up nutrients more efficiently.","Zyme":"An enzyme-based biostimulant used to aid nutrient breakdown and uptake in the soil."}}</script>

<script>
(function(){
  var DATA = JSON.parse(document.getElementById('data-json').textContent);
  var SLUGS = {'Badi':'badi','Kavita':'kavita','Sarai 1':'sarai1','Sarai 2':'sarai2'};
  var SLUG_TO_FARM = {}; Object.keys(SLUGS).forEach(function(f){ SLUG_TO_FARM[SLUGS[f]] = f; });

  var contentEl = document.getElementById('content');

  var lightboxEl = document.createElement('div');
  lightboxEl.className = 'lightbox';
  lightboxEl.innerHTML = '<button class="lightbox-close" aria-label="Close">\u2715</button><div class="lightbox-media"><img alt=""><div class="lightbox-details"></div></div>';
  document.body.appendChild(lightboxEl);
  var lightboxImg = lightboxEl.querySelector('.lightbox-media img');
  var lightboxDetails = lightboxEl.querySelector('.lightbox-details');
  function detailItem(icon, value){
    var item = el('div', 'lightbox-detail-item');
    item.appendChild(el('span', 'lightbox-detail-icon', icon));
    item.appendChild(el('span', null, value));
    return item;
  }
  function photoTakenAt(url){
    if (!url) return null;
    var m = /\/(\d{13})-/.exec(url);
    if (!m) return null;
    var d = new Date(parseInt(m[1], 10));
    if (isNaN(d.getTime())) return null;
    var datePart = d.toLocaleDateString('en-GB', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric' });
    var timePart = d.toLocaleTimeString('en-US', { timeZone: 'Asia/Kolkata', hour: 'numeric', minute: '2-digit', hour12: true });
    return datePart + ', ' + timePart;
  }
  var scrollLockCount = 0;
  function lockScroll(){ scrollLockCount++; document.body.style.overflow = 'hidden'; }
  function unlockScroll(){ scrollLockCount = Math.max(0, scrollLockCount - 1); if (scrollLockCount === 0) document.body.style.overflow = ''; }
  function openLightbox(src, alt, fd, e, url){
    lightboxImg.src = src; lightboxImg.alt = alt || '';
    lightboxDetails.innerHTML = '';
    var timeVal = photoTakenAt(url) || (e && e.date);
    var locVal = (fd && fd.profile && fd.profile.lat && fd.profile.lon) ? (fd.profile.lat.toFixed(6) + ', ' + fd.profile.lon.toFixed(6)) : null;
    if (timeVal) lightboxDetails.appendChild(detailItem('\ud83d\udd50', timeVal));
    if (locVal) lightboxDetails.appendChild(detailItem('\ud83d\udccd', locVal));
    lightboxEl.classList.add('open');
    lockScroll();
  }
  function closeLightbox(){
    lightboxEl.classList.remove('open');
    lightboxImg.src = '';
    lightboxDetails.innerHTML = '';
    unlockScroll();
  }
  lightboxEl.addEventListener('click', function(ev){
    if (ev.target === lightboxEl || ev.target.classList.contains('lightbox-close')) closeLightbox();
  });
  var qaModalEl = document.createElement('div');
  qaModalEl.className = 'qa-modal';
  qaModalEl.innerHTML = '<div class="qa-modal-sheet"><div class="qa-modal-head"><span class="qa-modal-title"></span><button type="button" class="qa-modal-close" aria-label="Close">\u2715</button></div><div class="qa-modal-body"></div></div>';
  document.body.appendChild(qaModalEl);
  var qaModalTitle = qaModalEl.querySelector('.qa-modal-title');
  var qaModalBody = qaModalEl.querySelector('.qa-modal-body');
  function openQaModal(title, bodyNode){
    qaModalTitle.textContent = title;
    qaModalBody.innerHTML = '';
    qaModalBody.appendChild(bodyNode);
    qaModalEl.classList.add('open');
    qaModalBody.scrollTop = 0;
    lockScroll();
  }
  function closeQaModal(){
    qaModalEl.classList.remove('open');
    unlockScroll();
  }
  qaModalEl.addEventListener('click', function(ev){
    if (ev.target === qaModalEl || ev.target.classList.contains('qa-modal-close')) closeQaModal();
  });
  window.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape') { closeLightbox(); closeQaModal(); }
  });

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function enableSmoothDetails(details){
    var summary = details.querySelector(':scope > summary');
    var content = details.querySelector(':scope > summary + *');
    if (!summary || !content) return;
    var wrap = document.createElement('div');
    wrap.className = 'details-collapse';
    content.parentNode.insertBefore(wrap, content);
    wrap.appendChild(content);
    var busy = false;
    summary.addEventListener('click', function(evt){
      evt.preventDefault();
      if (busy) return;
      busy = true;
      if (details.open) {
        var h = wrap.scrollHeight;
        wrap.style.maxHeight = h + 'px';
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){ wrap.style.maxHeight = '0px'; });
        });
        wrap.addEventListener('transitionend', function onEnd(ev){
          if (ev.target !== wrap || ev.propertyName !== 'max-height') return;
          wrap.removeEventListener('transitionend', onEnd);
          details.open = false;
          wrap.style.maxHeight = '';
          busy = false;
        });
      } else {
        details.open = true;
        var target = wrap.scrollHeight;
        wrap.style.maxHeight = '0px';
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){ wrap.style.maxHeight = target + 'px'; });
        });
        wrap.addEventListener('transitionend', function onEnd(ev){
          if (ev.target !== wrap || ev.propertyName !== 'max-height') return;
          wrap.removeEventListener('transitionend', onEnd);
          wrap.style.maxHeight = '';
          busy = false;
        });
      }
    });
  }

  function initials(name){
    if (!name) return '?';
    var parts = name.trim().split(/\s+/);
    var res = parts[0].charAt(0);
    if (parts.length > 1) res += parts[parts.length - 1].charAt(0);
    return res.toUpperCase();
  }

  var INTERCROP_DATA = {
    'Kavita': {
      teaser: 'Onion, sown alongside in Plots C2, C3 & 4',
      summary: 'Onion was planted alongside chickpea in Plots C2, C3 and 4 this season.',
      chips: ['Onion - Plots C2, C3, 4'],
      why: 'Chickpea fixes nitrogen in its root nodules, feeding soil that onion depends on since onion cannot fix its own; onion is also shallow-rooted and bulb-forming, so it draws water and nutrients from a different layer than chickpea\'s deeper taproot.',
      note: 'Onion and chickpea don\'t compete for the same resources: chickpea\'s root nodules add nitrogen to the soil that onion, a heavy nitrogen feeder, can draw on, while onion\'s shallow bulb roots and chickpea\'s deeper taproot pull water and nutrients from different depths of the same plot.'
    },
    'Sarai 1': {
      teaser: 'Barley, wheat, oats & chia, across different plots',
      summary: 'Barley was sown together with chickpea in Plot A6, and wheat, oats and chia were grown alongside chickpea in Plots 6 and 2 through the season.',
      chips: ['Barley - Plot A6', 'Wheat & oats - Plot 6', 'Chia - Plot 2'],
      why: 'Barley\'s shallow, fibrous roots draw water and nutrients from the upper soil while chickpea\'s deep taproot reaches lower layers, so the two compete less for the same resources; chickpea\'s root nodules also feed nitrogen back into the soil for the barley, and a barley stand is a recognised way to slow the pod-borer moth\'s movement between chickpea plants.',
      note: 'Barley, wheat and oats are all cereals: their shallow, fibrous roots draw from the upper soil while chickpea\'s deep taproot reaches lower layers, so they compete less for water and nutrients, and chickpea\'s nitrogen-fixing root nodules feed the soil the cereals depend on. Chia comes from a different plant family again, so mixing it in reduces the chance that a single pest or disease can sweep across the whole intercropped area.'
    },
    'Sarai 2': {
      teaser: 'Wheat, sown together at Sarai B',
      summary: 'Wheat was sown together with chickpea at Sarai B this season.',
      chips: ['Wheat - Sarai B'],
      why: 'Wheat\'s shallow, fibrous roots and chickpea\'s deep taproot draw from different depths in the same soil, so the two compete less for water - useful with limited winter irrigation - and chickpea\'s nitrogen-fixing root nodules feed nitrogen back into the soil for the wheat.',
      note: 'Wheat and chickpea root at different depths, so they draw water and nutrients from different layers of the same plot instead of competing for the same reserves - useful in a season with limited irrigation. Chickpea\'s root nodules also fix nitrogen that the wheat can draw on.'
    }
  };

  var PEST_LABEL_WHY = {
    'biological pest control': 'A natural fungus applied instead of a chemical pesticide.',
    'biological disease control': 'A beneficial fungus applied instead of a chemical fungicide.',
    'pest monitoring': 'Traps placed to watch for pest activity, not a treatment.',
    'Helicoverpa (pod borer) monitoring': 'Traps placed to catch pod-borer moths early, not a treatment.'
  };
  function renderEvent(e, fd){
    var cls = 'event' + (e.pest ? ' pest' : '');
    var ev = el('div', cls);
    var head = el('div', 'event-head');
    head.appendChild(el('span', 'date', e.date + ' - ' + e.category));
    var pestBtn = null, pestWhy = null;
    if (e.pest) {
      pestBtn = document.createElement('button');
      pestBtn.type = 'button';
      pestBtn.className = 'pest-badge';
      pestBtn.textContent = e.pest_label || 'pest/disease control';
      head.appendChild(pestBtn);
    }
    if (e.plot_tokens && e.plot_tokens.length) head.appendChild(el('span', 'meta', ' - plot(s): ' + e.plot_tokens.join(', ')));
    ev.appendChild(head);
    if (pestBtn) {
      pestWhy = el('p', 'pest-badge-why', PEST_LABEL_WHY[e.pest_label] || 'A pest or disease control step.');
      pestBtn.addEventListener('click', function(){
        var isOpen = pestBtn.classList.toggle('open');
        pestWhy.classList.toggle('show', isOpen);
      });
      ev.appendChild(pestWhy);
    }
    if (e.description) ev.appendChild(el('p', 'event-desc', e.description));
    e.notes.forEach(function(n){ ev.appendChild(el('div', 'event-note', n)); });
    if (e.photos.length) {
      var ph = el('div', 'photos');
      e.photos.forEach(function(url, idx){
        var thumb = DATA.photo_thumbs && DATA.photo_thumbs[url];
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'photo-thumb';
        btn.setAttribute('aria-label', 'Photo ' + (idx+1) + ' - view larger');
        if (thumb) {
          var img = document.createElement('img');
          img.src = thumb; img.alt = 'Task photo ' + (idx+1); img.loading = 'lazy';
          btn.appendChild(img);
          btn.addEventListener('click', function(){ openLightbox(thumb, 'Task photo ' + (idx+1), fd, e, url); });
        } else {
          btn.textContent = '📷 photo ' + (idx+1);
        }
        ph.appendChild(btn);
      });
      ev.appendChild(ph);
    }
    return ev;
  }

  function classifyEvent(e){
    var desc = (e.description || '').toLowerCase();
    var cat = e.category;
    if (e.pest_type === 'insect') return 'pest';
    if (e.pest_type === 'disease') return 'disease';
    if (desc.indexOf('thresh') !== -1 || desc.indexOf('harvest') !== -1 || cat === 'Harvesting') return 'harvest';
    if (cat === 'Sowing' || cat === 'Field Preparation') return 'prep';
    if (cat === 'Irrigation') return 'water';
    if (cat === 'Weeding' || desc.indexOf('weeded') !== -1) return 'weeding';
    if (desc.indexOf('nipped') !== -1 || desc.indexOf('tip-pruned') !== -1) return 'weeding';
    if (cat === 'Spraying / Drenching') return 'nutrition';
    return 'other';
  }

  var QA_DEFS = [
    {key:'prep', title:'How did the season start?'},
    {key:'nutrition', title:'What went onto the crop?'},
    {key:'weeding', title:'Was the field weeded or tended?', yesno:true},
    {key:'pest', title:'Was there any pest trouble?', yesno:true},
    {key:'disease', title:'Was there any disease?', yesno:true},
    {key:'water', title:'How was it irrigated?'},
    {key:'harvest', title:'What happened after harvest?'},
    {key:'other', title:'Anything else logged?'}
  ];

  function teaserFor(key, events, fd){
    var n = events.length;
    if (key === 'prep') {
      var sow = events.filter(function(e){ return e.category === 'Sowing'; })[0];
      return n + (n === 1 ? ' task' : ' tasks') + (sow ? ', sown ' + sow.date : '');
    }
    if (key === 'nutrition') {
      if (!n) return 'No spraying or drenching logged this season';
      var inputCount = (fd.inputs_used || []).length;
      return n + ' spray' + (n === 1 ? '' : 's') + ' & drench' + (n === 1 ? '' : 'es') + (inputCount ? ' · ' + inputCount + ' named input' + (inputCount === 1 ? '' : 's') : '');
    }
    if (key === 'weeding') {
      return n ? 'Yes' : 'No';
    }
    if (key === 'pest' || key === 'disease') {
      var confirmed = events.filter(function(e){ return (e.pest_label || '').toLowerCase().indexOf('monitoring') === -1; });
      return confirmed.length ? 'Yes' : 'No';
    }
    if (key === 'water') {
      return n ? (n + ' irrigation round' + (n === 1 ? '' : 's') + ' logged') : 'No irrigation task logged this season';
    }
    if (key === 'harvest') {
      var h = events[0];
      return n + (n === 1 ? ' task' : ' tasks') + (h ? ', starting ' + h.date : '');
    }
    return n + (n === 1 ? ' task' : ' tasks');
  }

  function renderFarm(farm){
    var fd = DATA.data[farm];
    contentEl.innerHTML = '';
    document.getElementById('pageTitle').textContent = 'Chickpea - ' + farm + ' Farm';

    // ===== Hero: farm facts =====
    var s1 = el('div', 'section');
    var card1 = el('div', 'card');

    var passportCard = el('div', 'passport-card');
    var passportHead = el('div', 'passport-head');
    passportHead.appendChild(el('span', 'passport-doc-label', 'FARM RECORD'));
    passportHead.appendChild(el('span', 'passport-doc-no', fd.profile.code || farm));
    passportCard.appendChild(passportHead);

    var recordHeader = el('div', 'record-header');
    recordHeader.appendChild(el('div', 'record-photo', initials(fd.field_lead ? fd.field_lead.name : '?')));
    var recordIdInfo = el('div', 'record-idinfo');
    recordIdInfo.appendChild(el('div', 'record-name', fd.field_lead ? fd.field_lead.name : 'Not identified'));
    recordIdInfo.appendChild(el('div', 'record-role', 'Farmer'));
    recordIdInfo.appendChild(el('div', 'record-area', fd.profile.area ? (parseFloat(fd.profile.area).toFixed(2) + ' ' + fd.profile.area_unit) : '-'));
    recordHeader.appendChild(recordIdInfo);
    passportCard.appendChild(recordHeader);

    var recordBadges = el('div', 'record-badges');
    var badgeDefs = [
      { icon: '\ud83c\udf3f', text: 'No chemical pesticide', why: 'Every pest and disease task logged this season used a biological method - like Beauveria bassiana or Trichoderma - instead of a chemical pesticide or fungicide.' }
    ];
    if (INTERCROP_DATA[farm]) {
      var firstCrop = INTERCROP_DATA[farm].chips[0].split(' - ')[0];
      badgeDefs.push({ icon: '\ud83c\udf3e', text: 'Intercropped with ' + firstCrop, why: INTERCROP_DATA[farm].why || ('Chickpea is a Rabi (winter) crop, sown after the monsoon and harvested in spring. Growing ' + firstCrop + ' alongside it in the same plot makes fuller use of the land.') });
    } else {
      badgeDefs.push({ icon: '\ud83c\udf3e', text: 'October 2025 – April 2026', why: 'Chickpea is a Rabi (winter) crop - grown through the cool, dry months after the monsoon, from sowing in autumn to harvest in spring.' });
    }
    badgeDefs.push({ icon: '\ud83d\udccd', text: 'GPS-mapped & dated', why: 'The farm\'s location is recorded with GPS coordinates, and every task in the log carries the date it happened - so this record can be checked against where and when the work actually took place.' });
    badgeDefs.push({ icon: '\ud83d\udd12', text: 'Single farm, single lot', why: 'The chickpea on this record all comes from one farm and one lot - it isn\'t mixed with produce from any other farm or field, so the trail back to its source stays intact.' });
    badgeDefs.forEach(function(b){
      var d = document.createElement('details');
      d.className = 'badge-pill';
      var s = document.createElement('summary');
      s.appendChild(el('span', 'badge-icon', b.icon));
      s.appendChild(el('span', 'badge-text', b.text));
      d.appendChild(s);
      d.appendChild(el('p', null, b.why));
      enableSmoothDetails(d);
      recordBadges.appendChild(d);
    });
    passportCard.appendChild(recordBadges);

    var recordAddress = el('div', 'record-address');
    recordAddress.appendChild(el('div', 'detail-label', 'ADDRESS'));
    recordAddress.appendChild(el('div', 'detail-value', fd.profile.address || '-'));
    if (fd.profile.lat && fd.profile.lon) {
      recordAddress.appendChild(el('div', 'record-gps', fd.profile.lat.toFixed(6) + ', ' + fd.profile.lon.toFixed(6)));
    }
    passportCard.appendChild(recordAddress);
    card1.appendChild(passportCard);

    var mapWrap = el('div');
    var mb = null;
    if (fd.profile.lat && fd.profile.lon) {
      mb = el('div', 'map-box');
      var mapDiv = document.createElement('div');
      mapDiv.className = 'farm-leaflet';
      mapDiv.id = 'farmLeafletMap';
      mb.appendChild(mapDiv);
      mapWrap.appendChild(mb);
      var linkRow = el('div', 'map-link');
      var glink = document.createElement('a');
      glink.href = 'https://www.google.com/maps?q=' + fd.profile.lat + ',' + fd.profile.lon;
      glink.target = '_blank'; glink.rel = 'noopener noreferrer';
      glink.textContent = 'Open in Google Maps ↗';
      linkRow.appendChild(glink);
      mapWrap.appendChild(linkRow);
    } else if (fd.map_image) {
      mb = el('div', 'map-box');
      var fimg = document.createElement('img'); fimg.src = fd.map_image; fimg.alt = farm + ' location';
      mb.appendChild(fimg);
      mapWrap.appendChild(mb);
    } else {
      mapWrap.appendChild(el('div', 'map-placeholder', '📍 Map snapshot for ' + farm + ' Farm pending - will appear here once added.'));
    }
    card1.appendChild(mapWrap);
    s1.appendChild(card1);
    s1.appendChild(el('p', 'after-map-sub', 'Everything logged on this farm this season is below - tap any question to see the dated record.'));
    contentEl.appendChild(s1);

    if (window.L && fd.profile.lat && fd.profile.lon && mb) {
      if (window.__farmLeaflet) { window.__farmLeaflet.remove(); window.__farmLeaflet = null; }
      var mapDivEl = document.getElementById('farmLeafletMap');
      if (mapDivEl) {
        var lMap = L.map(mapDivEl, {
          scrollWheelZoom: false, dragging: false, touchZoom: false,
          doubleClickZoom: false, boxZoom: false, keyboard: false, tap: false
        }).setView([fd.profile.lat, fd.profile.lon], 16);
        var tiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19,
          attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics'
        }).addTo(lMap);
        L.marker([fd.profile.lat, fd.profile.lon]).addTo(lMap).bindPopup(farm);
        window.__farmLeaflet = lMap;

        var tapOverlay = el('div', 'map-tap-overlay', 'Tap to explore map');
        mb.appendChild(tapOverlay);
        tapOverlay.addEventListener('click', function(){
          lMap.dragging.enable();
          lMap.touchZoom.enable();
          lMap.doubleClickZoom.enable();
          lMap.boxZoom.enable();
          lMap.keyboard.enable();
          if (lMap.tap) lMap.tap.enable();
          tapOverlay.remove();
        });

        var settled = false;
        function fallbackToImage(){
          if (settled) return; settled = true;
          if (tapOverlay && tapOverlay.parentNode) tapOverlay.remove();
          if (window.__farmLeaflet) { window.__farmLeaflet.remove(); window.__farmLeaflet = null; }
          if (fd.map_image && mb) {
            mb.innerHTML = '';
            var fbimg = document.createElement('img');
            fbimg.src = fd.map_image; fbimg.alt = farm + ' location';
            mb.appendChild(fbimg);
          }
        }
        var failTimer = setTimeout(fallbackToImage, 3000);
        tiles.on('load', function(){ settled = true; clearTimeout(failTimer); });
        tiles.on('tileerror', function(){ clearTimeout(failTimer); fallbackToImage(); });
      }
    }

    // ===== Q&A cards, grouped by what was done =====
    var buckets = {};
    QA_DEFS.forEach(function(d){ buckets[d.key] = []; });
    fd.timeline.forEach(function(e){
      var k = classifyEvent(e);
      if (!buckets[k]) buckets[k] = [];
      buckets[k].push(e);
    });

    var s2 = el('div', 'section');
    var stack = el('div', 'qa-stack');
    QA_DEFS.forEach(function(def){
      var events = buckets[def.key] || [];
      if (!def.yesno && !events.length) return;
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'qa-card';
      var q = el('div', 'qa-q');
      q.appendChild(el('span', 'qa-title', def.title));
      var teaserText = teaserFor(def.key, events, fd);
      if (def.yesno) {
        q.appendChild(el('span', 'qa-answer ' + (teaserText === 'Yes' ? 'yes' : 'no'), teaserText));
      } else {
        q.appendChild(el('span', 'qa-teaser', teaserText));
      }
      card.appendChild(q);
      var confirmedEvents = events.filter(function(e){ return (e.pest_label || '').toLowerCase().indexOf('monitoring') === -1; });
      var isHighlighted = (def.key === 'pest' || def.key === 'disease') && confirmedEvents.length > 0;
      card.appendChild(el('span', 'qa-count' + (isHighlighted ? ' has-activity' : ''), String(events.length)));

      var body = el('div', 'qa-body');
      if (events.length) {
        events.forEach(function(e){ body.appendChild(renderEvent(e, fd)); });
      } else {
        body.appendChild(el('div', 'qa-empty', 'No - nothing of this kind was logged for ' + farm + ' Farm this season.'));
      }
      if (def.key === 'nutrition' && fd.inputs_used && fd.inputs_used.length) {
        body.appendChild(el('p', 'qa-inputs-note', 'These inputs were named in the task log - tap one to see how it helps the crop:'));
        var il = el('div', 'inputs-list');
        var detail = el('div', 'input-detail', 'Tap an input above to see how it helps the crop.');
        fd.inputs_used.forEach(function(pair){
          var chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'input-chip';
          chip.textContent = pair[0];
          var cnt = document.createElement('span'); cnt.className = 'cnt'; cnt.textContent = '×' + pair[1];
          chip.appendChild(cnt);
          chip.addEventListener('click', function(){
            il.querySelectorAll('.input-chip').forEach(function(c){ c.classList.remove('active'); });
            chip.classList.add('active');
            var info = DATA.input_info && DATA.input_info[pair[0]];
            detail.textContent = info || ('No further detail on file for ' + pair[0] + ' yet.');
          });
          il.appendChild(chip);
        });
        body.appendChild(il);
        body.appendChild(detail);
      }
      card.addEventListener('click', function(){ openQaModal(def.title, body); });
      stack.appendChild(card);

      if (def.key === 'prep' && INTERCROP_DATA[farm]) {
        var ic = INTERCROP_DATA[farm];
        var icCard = document.createElement('button');
        icCard.type = 'button';
        icCard.className = 'qa-card';
        var icQ = el('div', 'qa-q');
        icQ.appendChild(el('span', 'qa-title', 'What else grew alongside it?'));
        icQ.appendChild(el('span', 'qa-teaser', ic.teaser));
        icCard.appendChild(icQ);
        icCard.appendChild(el('span', 'qa-count', String(ic.chips.length)));
        var icBody = el('div', 'qa-body');
        var icNote = el('div', 'intercrop-note');
        icNote.appendChild(el('p', null, ic.summary));
        var icChips = el('div', 'intercrop-chips');
        ic.chips.forEach(function(c){ icChips.appendChild(el('span', 'intercrop-chip', c)); });
        icNote.appendChild(icChips);
        icNote.appendChild(el('p', 'intercrop-general', ic.note || 'Intercropping a cereal or bulb crop with a legume like chickpea is common practice in this region.'));
        icBody.appendChild(icNote);
        icCard.addEventListener('click', function(){ openQaModal('What else grew alongside it?', icBody); });
        stack.appendChild(icCard);
      }
    });
    s2.appendChild(stack);
    contentEl.appendChild(s2);
  }

  function route(){
    var hash = (window.location.hash || '').replace('#','');
    var farm = SLUG_TO_FARM[hash] || 'Kavita';
    renderFarm(farm);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body>
