  header .eyebrow, header h1, header .season, .brand-logo { position:relative; z-index:1; }
  .brand-logo { display:block; width:44px; height:44px; border-radius:12px; margin:0 auto 12px; box-shadow: var(--shadow); }
  header .eyebrow { font-size:0.74rem; text-transform:uppercase; letter-spacing:0.12em; color: var(--header-eyebrow); margin-bottom:10px; font-weight:700; }
  header h1 { margin:0 0 6px; font-family: var(--font-display); font-weight:800; font-size: 1.9rem; letter-spacing:-0.01em; color: var(--green-900); text-wrap: balance; }
  header .season { font-size:0.86rem; color: var(--header-season); font-variant-numeric: tabular-nums; }
  #content { max-width: 720px; margin: 0 auto; padding: 26px 20px 64px; }
  .section { margin-bottom: 30px; }
  .section-title { display:flex; align-items:center; gap:10px; font-size:0.76rem; text-transform:uppercase;
                    letter-spacing:0.09em; color: var(--green-700); font-weight:700; margin-bottom:12px; }
  .section-title .num { width:21px; height:21px; border-radius:50%; background: var(--brand-solid); color:#fff;
                    display:inline-flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; }
  .card { background: var(--card); border:1px solid var(--border); border-radius:14px; padding:20px 22px; box-shadow: var(--shadow); }
  .farm-title { font-family: var(--font-display); font-size:1.5rem; font-weight:800; letter-spacing:-0.01em; color: var(--green-900); margin:0 0 4px; text-wrap: balance; }
  .farm-code { font-size:0.84rem; color: var(--muted); margin-bottom:16px; font-variant-numeric: tabular-nums; }
  .detail-grid { display:grid; grid-template-columns: 1fr 1fr; gap:14px 22px; font-size:0.9rem; margin-bottom:16px; }
  .detail-grid .full { grid-column: 1 / -1; }
  .detail-label { color: var(--muted); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:3px; }
  .detail-value { color: var(--text); font-variant-numeric: tabular-nums; }
  .map-box { margin-top:12px; border-radius:12px; overflow:hidden; border:1px solid var(--border); position:relative; }
  .map-box img { display:block; width:100%; height:auto; }
  .farm-leaflet { width:100%; height:300px; background: var(--green-100); }
  .map-link { margin-top:8px; text-align:right; }
  .map-link a { font-size:0.8rem; color: var(--green-700); text-decoration:none; font-weight:600; }
  .map-link a:hover { text-decoration:underline; }
  .map-placeholder { background: var(--green-100); color: var(--green-900); font-size:0.86rem; padding:20px;
                      text-align:center; border-radius:12px; border:1px dashed var(--border); }
  .caveat { font-size:0.77rem; color: var(--muted); font-style:italic; margin-top:8px; }
  .event { border-left:3px solid var(--border); padding:9px 0 9px 16px; margin-bottom:6px; }
  .event.pest { border-left-color: var(--pest); }
  .event-head { font-size:0.89rem; font-weight:700; color: var(--text); }
  .event-head .date { font-variant-numeric: tabular-nums; color: var(--green-700); }
  .event-head .meta { font-weight:400; color: var(--muted); font-size:0.78rem; }
  .pest-badge { display:inline-block; background: var(--pest-bg); color: var(--pest); font-size:0.68rem;
                font-weight:700; padding:2px 8px; border-radius:999px; margin-left:6px; vertical-align:middle; }
  .supp-badge { display:inline-block; background: var(--green-100); color: var(--green-700); font-size:0.68rem;
                font-weight:700; padding:2px 8px; border-radius:999px; margin-left:6px; vertical-align:middle; }
  .status-badge { display:inline-block; background: var(--neutral-badge-bg); color: var(--neutral-badge-text); font-size:0.66rem;
                  font-weight:700; padding:2px 8px; border-radius:999px; margin-left:6px; vertical-align:middle; }
  .event-desc { font-size:0.9rem; margin:4px 0 0; }
  .event-note { font-size:0.81rem; color: var(--muted); margin:3px 0 0; padding-left:10px; border-left:2px solid var(--border); }
  .photos { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .photo-thumb { display:block; width:64px; height:64px; border-radius:8px; overflow:hidden; border:1px solid var(--border);
                 flex:none; padding:0; background:none; cursor:pointer; }
  .photo-thumb img { display:block; width:100%; height:100%; object-fit:cover; }
  .lightbox { position:fixed; inset:0; background:rgba(10,14,8,0.86); display:none; align-items:center; justify-content:center;
              padding:32px; z-index:100; }
  .lightbox.open { display:flex; }
  .lightbox img { max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,0.4); }
  .lightbox-close { position:absolute; top:18px; right:22px; background:rgba(255,255,255,0.12); color:#fff; border:none;
                     width:36px; height:36px; border-radius:50%; font-size:1.1rem; cursor:pointer; line-height:1; }
  .lightbox-close:hover { background:rgba(255,255,255,0.22); }
  .inputs-list { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
  .input-chip { background: var(--green-100); color: var(--green-900); font-size:0.8rem; font-weight:600;
                padding:4px 12px; border-radius:999px; border:1px solid transparent; cursor:pointer; font-family: var(--font-body); }
  .input-chip:hover { border-color: var(--brand-solid-hover); }
  .input-chip.active { background: var(--brand-solid); color:#fff; }
  .input-chip.active .cnt { color: rgba(255,255,255,0.8); }
  .input-chip .cnt { font-variant-numeric: tabular-nums; color: var(--muted); font-weight:400; margin-left:3px; }
  .input-detail { font-size:0.85rem; color: var(--text); background: var(--green-100); border-radius:10px;
                  padding:12px 14px; margin-top:10px; line-height:1.5; }
  footer { text-align:center; font-size:0.77rem; color: var(--muted); padding: 14px 20px 34px; }

/* --- Leaflet (inlined) --- */
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}

hat supplies readily-absorbed amino acids, helping the plant grow steadily and recover from stress.","PDR":"Short for plant-defence regulator — a formulation typically paired with nutrient sprays to support the plant's own natural resilience.","Microalgal":"A microalgae-based biostimulant that supplies micronutrients and growth compounds supporting overall plant vigour.","Beauveria":"Beauveria bassiana, a naturally occurring fungus that infects and controls soft-bodied insect pests — a biological alternative to chemical pesticides.","Jeevamrit":"A traditional fermented microbial culture (cow dung, cow urine, jaggery and pulse flour) used to build up beneficial soil microbes and improve nutrient availability to the plant.","Trichoderma":"A beneficial soil fungus that colonises the root zone and outcompetes disease-causing soil pathogens — a biological approach to disease control.","Potassium humate":"A humic-acid-based soil conditioner that improves root development and helps the plant take up nutrients more efficiently.","Zyme":"An enzyme-based biostimulant used to aid nutrient breakdown and uptake in the soil."}}</script>

<script>
(function(){
  var DATA = JSON.parse(document.getElementById('data-json').textContent);
  var SLUGS = {'Badi':'badi','Kavita':'kavita','Sarai 1':'sarai1','Sarai 2':'sarai2'};
  var SLUG_TO_FARM = {}; Object.keys(SLUGS).forEach(function(f){ SLUG_TO_FARM[SLUGS[f]] = f; });

  var contentEl = document.getElementById('content');

  var lightboxEl = document.createElement('div');
  lightboxEl.className = 'lightbox';
  lightboxEl.innerHTML = '<button class="lightbox-close" aria-label="Close">\u2715</button><img alt="">';
  document.body.appendChild(lightboxEl);
  var lightboxImg = lightboxEl.querySelector('img');
  function openLightbox(src, alt){
    lightboxImg.src = src; lightboxImg.alt = alt || '';
    lightboxEl.classList.add('open');
  }
  function closeLightbox(){
    lightboxEl.classList.remove('open');
    lightboxImg.src = '';
  }
  lightboxEl.addEventListener('click', function(ev){
    if (ev.target === lightboxEl || ev.target.classList.contains('lightbox-close')) closeLightbox();
  });
  window.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape') closeLightbox();
  });

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function renderEvent(e){
    var cls = 'event' + (e.pest ? ' pest' : '');
    var ev = el('div', cls);
    var head = el('div', 'event-head');
    head.appendChild(el('span', 'date', e.date + ' — ' + e.category));
    if (e.pest) head.appendChild(el('span', 'pest-badge', e.pest_label || 'pest/disease control'));
    if (e.plot_tokens && e.plot_tokens.length) head.appendChild(el('span', 'meta', ' — plot(s): ' + e.plot_tokens.join(', ')));
    ev.appendChild(head);
    if (e.description) ev.appendChild(el('p', 'event-desc', e.description));
    e.notes.forEach(function(n){ ev.appendChild(el('div', 'event-note', n)); });
    if (e.photos.length) {
      var ph = el('div', 'photos');
      e.photos.forEach(function(url, idx){
        var thumb = DATA.photo_thumbs && DATA.photo_thumbs[url];
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'photo-thumb';
        btn.setAttribute('aria-label', 'Photo ' + (idx+1) + ' — view larger');
        if (thumb) {
          var img = document.createElement('img');
          img.src = thumb; img.alt = 'Task photo ' + (idx+1); img.loading = 'lazy';
          btn.appendChild(img);
          btn.addEventListener('click', function(){ openLightbox(thumb, 'Task photo ' + (idx+1)); });
        } else {
          btn.textContent = '📷 photo ' + (idx+1);
        }
        ph.appendChild(btn);
      });
      ev.appendChild(ph);
    }
    return ev;
  }

  function classifyEvent(e){
    var desc = (e.description || '').toLowerCase();
    var cat = e.category;
    if (e.pest_type === 'insect') return 'pest';
    if (e.pest_type === 'disease') return 'disease';
    if (desc.indexOf('thresh') !== -1 || desc.indexOf('harvest') !== -1 || cat === 'Harvesting') return 'harvest';
    if (cat === 'Sowing' || cat === 'Field Preparation') return 'prep';
    if (cat === 'Irrigation') return 'water';
    if (cat === 'Weeding' || desc.indexOf('weeded') !== -1) return 'weeding';
    if (desc.indexOf('nipped') !== -1 || desc.indexOf('tip-pruned') !== -1) return 'weeding';
    if (cat === 'Spraying / Drenching') return 'nutrition';
    return 'other';
  }

  var QA_DEFS = [
    {key:'prep', title:'How did the season start?'},
    {key:'nutrition', title:'What went onto the crop?'},
    {key:'weeding', title:'Was the field weeded or tended?'},
    {key:'pest', title:'Was there any pest trouble?'},
    {key:'disease', title:'Was there any disease?'},
    {key:'water', title:'How was it irrigated?'},
    {key:'harvest', title:'What happened after harvest?'},
    {key:'other', title:'Anything else logged?'}
  ];

  function teaserFor(key, events, fd){
    var n = events.length;
    if (key === 'prep') {
      var sow = events.filter(function(e){ return e.category === 'Sowing'; })[0];
      return n + (n === 1 ? ' task' : ' tasks') + (sow ? ', sown ' + sow.date : '');
    }
    if (key === 'nutrition') {
      if (!n) return 'No spraying or drenching logged this season';
      var inputCount = (fd.inputs_used || []).length;
      return n + ' spray' + (n === 1 ? '' : 's') + ' & drench' + (n === 1 ? '' : 'es') + (inputCount ? ' · ' + inputCount + ' named input' + (inputCount === 1 ? '' : 's') : '');
    }
    if (key === 'weeding') {
      return n ? (n + (n === 1 ? ' round' : ' rounds') + ' logged') : 'No weeding task logged this season';
    }
    if (key === 'pest') {
      if (!n) return 'No pest-related task logged this season';
      return n + (n === 1 ? ' task' : ' tasks') + ' — ' + (events[0].pest_label || 'pest monitoring/control');
    }
    if (key === 'disease') {
      if (!n) return 'No disease-related task logged this season';
      return n + (n === 1 ? ' task' : ' tasks') + ' — ' + (events[0].pest_label || 'disease control');
    }
    if (key === 'water') {
      return n ? (n + ' irrigation round' + (n === 1 ? '' : 's') + ' logged') : 'No irrigation task logged this season';
    }
    if (key === 'harvest') {
      var h = events[0];
      return n + (n === 1 ? ' task' : ' tasks') + (h ? ', starting ' + h.date : '');
    }
    return n + (n === 1 ? ' task' : ' tasks');
  }

  function renderFarm(farm){
    var fd = DATA.data[farm];
    contentEl.innerHTML = '';
    document.getElementById('pageTitle').textContent = 'Chickpea — ' + farm;

    // ===== Hero: farm facts =====
    var s1 = el('div', 'section');
    var card1 = el('div', 'card');
    var hero = el('div', 'hero');
    hero.appendChild(el('h1', null, 'Grown at ' + farm + ', over the 2025–26 season.'));
    hero.appendChild(el('p', 'sub', 'Everything logged on this farm this season is below — tap any question to see the dated record.'));
    card1.appendChild(hero);

    var grid = el('div', 'detail-grid');
    function addDetail(label, value, full){
      var d = el('div', full ? 'full' : null);
      d.appendChild(el('div', 'detail-label', label));
      d.appendChild(el('div', 'detail-value', value || '—'));
      grid.appendChild(d);
    }
    addDetail('Grown by', fd.field_lead ? fd.field_lead.name : 'Not identified');
    addDetail('Farm area', fd.profile.area ? (fd.profile.area + ' ' + fd.profile.area_unit) : '—');
    addDetail('Address', fd.profile.address, true);
    if (fd.profile.lat && fd.profile.lon) {
      addDetail('GPS coordinates', fd.profile.lat.toFixed(6) + ', ' + fd.profile.lon.toFixed(6), true);
    }
    card1.appendChild(grid);

    var mapWrap = el('div');
    var mb = null;
    if (fd.profile.lat && fd.profile.lon) {
      mb = el('div', 'map-box');
      var mapDiv = document.createElement('div');
      mapDiv.className = 'farm-leaflet';
      mapDiv.id = 'farmLeafletMap';
      mb.appendChild(mapDiv);
      mapWrap.appendChild(mb);
      var linkRow = el('div', 'map-link');
      var glink = document.createElement('a');
      glink.href = 'https://www.google.com/maps?q=' + fd.profile.lat + ',' + fd.profile.lon;
      glink.target = '_blank'; glink.rel = 'noopener noreferrer';
      glink.textContent = 'Open in Google Maps ↗';
      linkRow.appendChild(glink);
      mapWrap.appendChild(linkRow);
    } else if (fd.map_image) {
      mb = el('div', 'map-box');
      var fimg = document.createElement('img'); fimg.src = fd.map_image; fimg.alt = farm + ' location';
      mb.appendChild(fimg);
      mapWrap.appendChild(mb);
    } else {
      mapWrap.appendChild(el('div', 'map-placeholder', '📍 Map snapshot for ' + farm + ' pending — will appear here once added.'));
    }
    card1.appendChild(mapWrap);
    s1.appendChild(card1);
    contentEl.appendChild(s1);

    if (window.L && fd.profile.lat && fd.profile.lon && mb) {
      if (window.__farmLeaflet) { window.__farmLeaflet.remove(); window.__farmLeaflet = null; }
      var mapDivEl = document.getElementById('farmLeafletMap');
      if (mapDivEl) {
        var lMap = L.map(mapDivEl, { scrollWheelZoom: false }).setView([fd.profile.lat, fd.profile.lon], 16);
        var tiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19,
          attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics'
        }).addTo(lMap);
        L.marker([fd.profile.lat, fd.profile.lon]).addTo(lMap).bindPopup(farm);
        window.__farmLeaflet = lMap;

        var settled = false;
        function fallbackToImage(){
          if (settled) return; settled = true;
          if (window.__farmLeaflet) { window.__farmLeaflet.remove(); window.__farmLeaflet = null; }
          if (fd.map_image && mb) {
            mb.innerHTML = '';
            var fbimg = document.createElement('img');
            fbimg.src = fd.map_image; fbimg.alt = farm + ' location';
            mb.appendChild(fbimg);
          }
        }
        var failTimer = setTimeout(fallbackToImage, 3000);
        tiles.on('load', function(){ settled = true; clearTimeout(failTimer); });
        tiles.on('tileerror', function(){ clearTimeout(failTimer); fallbackToImage(); });
      }
    }

    // ===== Q&A cards, grouped by what was done =====
    var buckets = {};
    QA_DEFS.forEach(function(d){ buckets[d.key] = []; });
    fd.timeline.forEach(function(e){
      var k = classifyEvent(e);
      if (!buckets[k]) buckets[k] = [];
      buckets[k].push(e);
    });

    var s2 = el('div', 'section');
    var stack = el('div', 'qa-stack');
    QA_DEFS.forEach(function(def){
      var events = buckets[def.key] || [];
      if (def.key === 'other' && !events.length) return;
      var card = document.createElement('details');
      card.className = 'qa-card';
      var summary = document.createElement('summary');
      var q = el('div', 'qa-q');
      q.appendChild(el('span', 'qa-title', def.title));
      q.appendChild(el('span', 'qa-teaser', teaserFor(def.key, events, fd)));
      summary.appendChild(q);
      var isHighlighted = (def.key === 'pest' || def.key === 'disease') && events.length > 0;
      summary.appendChild(el('span', 'qa-count' + (isHighlighted ? ' has-activity' : ''), String(events.length)));
      card.appendChild(summary);

      var body = el('div', 'qa-body');
      if (events.length) {
        events.forEach(function(e){ body.appendChild(renderEvent(e)); });
      } else {
        body.appendChild(el('div', 'qa-empty', 'Nothing of this kind was logged for ' + farm + ' this season.'));
      }
      if (def.key === 'nutrition' && fd.inputs_used && fd.inputs_used.length) {
        body.appendChild(el('p', 'qa-inputs-note', 'These inputs were named in the task log — tap one to see how it helps the crop:'));
        var il = el('div', 'inputs-list');
        var detail = el('div', 'input-detail', 'Tap an input above to see how it helps the crop.');
        fd.inputs_used.forEach(function(pair){
          var chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'input-chip';
          chip.textContent = pair[0];
          var cnt = document.createElement('span'); cnt.className = 'cnt'; cnt.textContent = '×' + pair[1];
          chip.appendChild(cnt);
          chip.addEventListener('click', function(){
            il.querySelectorAll('.input-chip').forEach(function(c){ c.classList.remove('active'); });
            chip.classList.add('active');
            var info = DATA.input_info && DATA.input_info[pair[0]];
            detail.textContent = info || ('No further detail on file for ' + pair[0] + ' yet.');
          });
          il.appendChild(chip);
        });
        body.appendChild(il);
        body.appendChild(detail);
      }
      card.appendChild(body);
      stack.appendChild(card);
    });
    var firstCard = stack.querySelector('.qa-card');
    if (firstCard) firstCard.open = true;
    s2.appendChild(stack);
    contentEl.appendChild(s2);
  }

  function route(){
    var hash = (window.location.hash || '').replace('#','');
    var farm = SLUG_TO_FARM[hash] || 'Badi';
    renderFarm(farm);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body>
</html>
